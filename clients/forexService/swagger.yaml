components:
  schemas:
    AccessTokenResponse:
      required:
        - accessToken
        - expiresIn
        - refreshToken
      type: object
      properties:
        tokenType:
          type: string
          nullable: true
          readOnly: true
        accessToken:
          type: string
          nullable: true
        expiresIn:
          type: integer
          format: int64
        refreshToken:
          type: string
          nullable: true
      additionalProperties: false
    CurrencyId:
      type: object
      properties:
        value:
          type: string
          nullable: true
          readOnly: true
        code:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
      additionalProperties: false
    ErrorEnvelope:
      type: object
      properties:
        isSuccess:
          type: boolean
          readOnly: true
        errorMessage:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        activityId:
          type: string
          nullable: true
          readOnly: true
      additionalProperties: false
    ExchangeRate:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/Money'
        target:
          $ref: '#/components/schemas/Money'
        rate:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    ExchangeRateEnvelope:
      type: object
      properties:
        isSuccess:
          type: boolean
          readOnly: true
        errorMessage:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        activityId:
          type: string
          nullable: true
          readOnly: true
        result:
          $ref: '#/components/schemas/ExchangeRate'
      additionalProperties: false
    ForexRatesDto:
      type: object
      properties:
        success:
          type: boolean
        date:
          type: string
          nullable: true
        base:
          type: string
          nullable: true
        timestamp:
          type: integer
          format: int64
        requestTimestamp:
          type: string
          format: date-time
        rates:
          type: object
          additionalProperties:
            type: number
            format: double
          nullable: true
      additionalProperties: false
    ForexRatesDtoEnvelope:
      type: object
      properties:
        isSuccess:
          type: boolean
          readOnly: true
        errorMessage:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        activityId:
          type: string
          nullable: true
          readOnly: true
        result:
          $ref: '#/components/schemas/ForexRatesDto'
      additionalProperties: false
    ForgotPasswordRequest:
      required:
        - email
      type: object
      properties:
        email:
          type: string
          nullable: true
      additionalProperties: false
    HttpValidationProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          nullable: true
      additionalProperties: { }
    InfoRequest:
      type: object
      properties:
        newEmail:
          type: string
          nullable: true
        newPassword:
          type: string
          nullable: true
        oldPassword:
          type: string
          nullable: true
      additionalProperties: false
    InfoResponse:
      required:
        - email
        - isEmailConfirmed
      type: object
      properties:
        email:
          type: string
          nullable: true
        isEmailConfirmed:
          type: boolean
      additionalProperties: false
    LoginRequest:
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
        twoFactorCode:
          type: string
          nullable: true
        twoFactorRecoveryCode:
          type: string
          nullable: true
      additionalProperties: false
    Money:
      type: object
      properties:
        amount:
          type: number
          format: double
        currency:
          $ref: '#/components/schemas/CurrencyId'
      additionalProperties: false
    MoneyEnvelope:
      type: object
      properties:
        isSuccess:
          type: boolean
          readOnly: true
        errorMessage:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        activityId:
          type: string
          nullable: true
          readOnly: true
        result:
          $ref: '#/components/schemas/Money'
      additionalProperties: false
    RefreshRequest:
      required:
        - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
          nullable: true
      additionalProperties: false
    RegisterRequest:
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
      additionalProperties: false
    ResendConfirmationEmailRequest:
      required:
        - email
      type: object
      properties:
        email:
          type: string
          nullable: true
      additionalProperties: false
    ResetPasswordRequest:
      required:
        - email
        - newPassword
        - resetCode
      type: object
      properties:
        email:
          type: string
          nullable: true
        resetCode:
          type: string
          nullable: true
        newPassword:
          type: string
          nullable: true
      additionalProperties: false
    TwoFactorRequest:
      type: object
      properties:
        enable:
          type: boolean
          nullable: true
        twoFactorCode:
          type: string
          nullable: true
        resetSharedKey:
          type: boolean
        resetRecoveryCodes:
          type: boolean
        forgetMachine:
          type: boolean
      additionalProperties: false
    TwoFactorResponse:
      required:
        - isMachineRemembered
        - isTwoFactorEnabled
        - recoveryCodesLeft
        - sharedKey
      type: object
      properties:
        sharedKey:
          type: string
          nullable: true
        recoveryCodesLeft:
          type: integer
          format: int32
        recoveryCodes:
          type: array
          items:
            type: string
          nullable: true
        isTwoFactorEnabled:
          type: boolean
        isMachineRemembered:
          type: boolean
      additionalProperties: false
