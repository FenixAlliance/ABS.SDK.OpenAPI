  /api/v2/ForexService/Exchange/Latest:
    get:
      tags:
        - Exchange
      summary: Exchange currency at latest rates
      description: Exchange an amount of money from one currency to another using the latest available exchange rates.
      operationId: ExchangeAmountAsync
      parameters:
        - name: amount
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: sourceCurrencyId
          in: query
          required: true
          schema:
            type: string
        - name: targetCurrencyId
          in: query
          required: true
          schema:
            type: string
      responses:
