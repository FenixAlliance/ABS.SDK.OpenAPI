            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
  '/api/v2/SystemService/BusinessDomains/{businessDomainId}':
    get:
      tags:
        - BusinessDomains
      summary: Retrieve a business domain by its ID
      description: 'Retrieve any business domain by its ID, regardless of owning tenant.'
      operationId: BusinessDomains_GetSystemBusinessDomainById
      parameters:
        - name: businessDomainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDomainDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/BusinessDomainDtoEnvelope'
    delete:
      tags:
        - BusinessDomains
      summary: Delete a business domain
      description: 'Removes any business domain from the system, regardless of owning tenant.'
      operationId: BusinessDomains_DeleteSystemBusinessDomain
      parameters:
        - name: businessDomainId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
  '/api/v2/SystemService/BusinessDomains/{businessDomainId}/Verify':
    post:
