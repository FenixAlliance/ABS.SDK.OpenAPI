openapi: 3.0.4
info:
  title: SystemService
  termsOfService: https://absuite.net/eula
  contact:
    name: Fenix Alliance Inc.
    url: https://fenixalliance.com.co/Support
    email: support@fenix-alliance.com
  license:
    name: Fenix Alliance Inc.
    url: https://fenix-alliance.com.co/Legal/Policies/eula
  version: 2.0.0.0
servers:
  - url: '{server}'
    description: Alliance Business Suite API
    variables:
      server:
        default: https://absuite.net
        description: ABS instance base URL
        enum:
          - https://absuite.net
          - https://test.absuite.net
          - https://dev.absuite.net
          - https://localhost:44388
paths:
  /api/v2/SystemService/Antiforgery/GetAndStoreTokens:
    get:
      tags:
        - Antiforgery
      summary: Get and store antiforgery tokens
      description: Generates antiforgery tokens and stores them in the current HTTP context.
      operationId: GetAndStoreTokens
      parameters:
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '200':
          description: OK
  /api/v2/SystemService/Antiforgery/IsRequestValid:
    get:
      tags:
        - Antiforgery
      summary: Validate antiforgery request
      description: Validates whether the current HTTP request contains a valid antiforgery token.
      operationId: IsRequestValidAsync
      parameters:
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '200':
          description: OK
  /api/v2/SystemService/BusinessDomains:
    get:
      tags:
        - BusinessDomains
      summary: Retrieve all business domains in the system
      description: Retrieve all registered business domains across every tenant (global administrators only).
      operationId: GetSystemBusinessDomains
      parameters:
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessDomainDtoListEnvelope'
            application/xml:
              schema:
