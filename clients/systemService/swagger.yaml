      additionalProperties: false
    EmailDispatchRequest:
      required:
        - culture
        - message
        - recipients
        - title
        - uiCulture
      type: object
      properties:
        title:
          maxLength: 150
          minLength: 0
          type: string
        message:
          minLength: 10
          type: string
        buttonLink:
          type: string
          format: uri
          nullable: true
        buttonText:
          maxLength: 50
          minLength: 0
          type: string
          nullable: true
        alertMessage:
          type: string
          nullable: true
        alertType:
          enum:
            - None
            - Info
            - Error
            - Warning
            - Success
            - Action
            - Alert
