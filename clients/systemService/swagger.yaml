components:
  schemas:
    AccessTokenResponse:
      required:
        - accessToken
        - expiresIn
        - refreshToken
      type: object
      properties:
        tokenType:
          type: string
          nullable: true
          readOnly: true
        accessToken:
          type: string
          nullable: true
        expiresIn:
          type: integer
          format: int64
        refreshToken:
          type: string
          nullable: true
      additionalProperties: false
    ApplicationPrincipalDetailDto:
      type: object
      properties:
        id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        displayName:
          type: string
          nullable: true
        principalKind:
          enum:
            - Human
            - Agent
            - Application
            - Service
            - System
          type: string
        principalStatus:
          enum:
            - Active
            - Suspended
            - Disabled
          type: string
        businessApplicationId:
          type: string
          nullable: true
        businessApplicationName:
          type: string
          nullable: true
        businessApplicationNamespace:
          type: string
          nullable: true
        businessApplicationDisabled:
          type: boolean
        systemLocked:
          type: boolean
        tenantId:
          type: string
          nullable: true
        enrollmentId:
          type: string
          nullable: true
        enrollmentDisabled:
          type: boolean
        grantedPermissions:
          type: array
          items:
            type: string
          nullable: true
      additionalProperties: false
    ApplicationPrincipalDetailDtoEnvelope:
      type: object
      properties:
        isSuccess:
          type: boolean
          readOnly: true
        errorMessage:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        httpStatus:
          type: integer
          format: int32
          nullable: true
        errorCode:
          type: string
          nullable: true
        validationDetails:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            nullable: true
          nullable: true
        activityId:
          type: string
          nullable: true
          readOnly: true
        result:
          $ref: '#/components/schemas/ApplicationPrincipalDetailDto'
