components:
  schemas:
    AccessTokenResponse:
      required:
        - accessToken
        - expiresIn
        - refreshToken
      type: object
      properties:
        tokenType:
          type: string
          nullable: true
          readOnly: true
        accessToken:
          type: string
          nullable: true
        expiresIn:
          type: integer
          format: int64
        refreshToken:
          type: string
          nullable: true
      additionalProperties: false
    AddProductToCompareRequest:
      type: object
      properties:
        id:
          type: string
          nullable: true
          readOnly: true
        cartId:
          type: string
          nullable: true
        itemId:
          type: string
          nullable: true
      additionalProperties: false
    BooleanEnvelope:
      type: object
      properties:
        isSuccess:
          type: boolean
          readOnly: true
        errorMessage:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        httpStatus:
          type: integer
          format: int32
          nullable: true
        errorCode:
          type: string
          nullable: true
        validationDetails:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            nullable: true
          nullable: true
        activityId:
          type: string
          nullable: true
          readOnly: true
        result:
          type: boolean
      additionalProperties: false
    CartDto:
      type: object
      properties:
        id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        ip:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        total:
          type: number
          format: double
        taxes:
          type: number
          format: double
        freight:
          type: number
          format: double
        subTotal:
          type: number
          format: double
        currencyId:
          type: string
          nullable: true
        countryId:
          type: string
          nullable: true
        itemCartRecordsCount:
          type: integer
          format: int32
          nullable: true
        itemToCompareRecordsCount:
          type: integer
          format: int32
          nullable: true
        saleChannel:
          $ref: '#/components/schemas/SaleChannel'
        directSellerTenantId:
          type: string
          nullable: true
      additionalProperties: false
    CartDtoEnvelope:
      type: object
      properties:
        isSuccess:
          type: boolean
          readOnly: true
        errorMessage:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
