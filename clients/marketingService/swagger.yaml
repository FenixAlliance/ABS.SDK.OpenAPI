components:
  schemas:
    AccessTokenResponse:
      required:
        - accessToken
        - expiresIn
        - refreshToken
      type: object
      properties:
        tokenType:
          type: string
          nullable: true
          readOnly: true
        accessToken:
          type: string
          nullable: true
        expiresIn:
          type: integer
          format: int64
        refreshToken:
          type: string
          nullable: true
      additionalProperties: false
    EmailGroupCreateDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
      additionalProperties: false
    EmailGroupDto:
      type: object
      properties:
        id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        tenantId:
          type: string
          nullable: true
        enrollmentId:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
      additionalProperties: false
    EmailGroupDtoEnvelope:
      type: object
      properties:
        isSuccess:
          type: boolean
          readOnly: true
        errorMessage:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        activityId:
          type: string
          nullable: true
          readOnly: true
        result:
          $ref: '#/components/schemas/EmailGroupDto'
      additionalProperties: false
    EmailGroupDtoListEnvelope:
      type: object
      properties:
        isSuccess:
          type: boolean
          readOnly: true
        errorMessage:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        activityId:
          type: string
          nullable: true
          readOnly: true
        result:
          type: array
          items:
            $ref: '#/components/schemas/EmailGroupDto'
          nullable: true
      additionalProperties: false
    EmailGroupUpdateDto:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
      additionalProperties: false
    EmailSignatureCreateDto:
      required:
        - title
      type: object
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        title:
          maxLength: 100
          minLength: 3
          type: string
        published:
          type: boolean
        description:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        markup:
          type: string
          nullable: true
        featuredImageUrl:
          type: string
          nullable: true
        codeType:
          enum:
            - Razor
            - CSharp
            - CSHtml
            - Liquid
            - Html5
            - Markdown
            - Markup
          type: string
          nullable: true
      additionalProperties: false
