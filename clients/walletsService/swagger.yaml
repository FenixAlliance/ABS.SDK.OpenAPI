          enum:
            - Individual
            - Organization
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          format: tel
          nullable: true
        publicName:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        jobTitle:
          type: string
          nullable: true
        coverUrl:
          type: string
          nullable: true
        avatarUrl:
          type: string
