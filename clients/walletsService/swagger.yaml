components:
  schemas:
    AccessTokenResponse:
      required:
        - accessToken
        - expiresIn
        - refreshToken
      type: object
      properties:
        tokenType:
          type: string
          nullable: true
          readOnly: true
        accessToken:
          type: string
          nullable: true
        expiresIn:
          type: integer
          format: int64
        refreshToken:
          type: string
          nullable: true
      additionalProperties: false
    BankAccountCreateDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        name:
          type: string
          nullable: true
        iban:
          type: string
          nullable: true
        swift:
          type: string
          nullable: true
        branchCode:
          type: string
          nullable: true
        bankAccountNumber:
          type: string
          nullable: true
        bankId:
          maxLength: 36
          minLength: 0
          type: string
          nullable: true
        bankProfileId:
          maxLength: 36
          minLength: 0
          type: string
          nullable: true
        walletId:
          maxLength: 36
          minLength: 0
          type: string
          nullable: true
      additionalProperties: false
    BankAccountDto:
      type: object
      properties:
        id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        name:
          type: string
          nullable: true
        iban:
          type: string
          nullable: true
        swift:
          type: string
          nullable: true
        branchCode:
          type: string
          nullable: true
        bankAccountNumber:
          type: string
          nullable: true
        qualifiedName:
          type: string
          nullable: true
        bankId:
          type: string
          nullable: true
        bankProfileId:
          type: string
          nullable: true
        walletId:
          type: string
          nullable: true
        tenantId:
          type: string
          nullable: true
        enrollmentId:
          type: string
          nullable: true
      additionalProperties: false
    BankAccountDtoEnvelope:
      type: object
      properties:
        isSuccess:
          type: boolean
          readOnly: true
        errorMessage:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        activityId:
          type: string
          nullable: true
          readOnly: true
        result:
          $ref: '#/components/schemas/BankAccountDto'
      additionalProperties: false
    BankAccountDtoListEnvelope:
      type: object
      properties:
        isSuccess:
          type: boolean
          readOnly: true
        errorMessage:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        activityId:
          type: string
          nullable: true
          readOnly: true
        result:
          type: array
          items:
            $ref: '#/components/schemas/BankAccountDto'
          nullable: true
      additionalProperties: false
    BankAccountUpdateDto:
      type: object
      properties:
        name:
          type: string
          nullable: true
        iban:
          type: string
          nullable: true
        swift:
          type: string
          nullable: true
        branchCode:
          type: string
          nullable: true
        bankAccountNumber:
          type: string
          nullable: true
        bankId:
          maxLength: 36
          minLength: 0
          type: string
          nullable: true
        bankProfileId:
          maxLength: 36
          minLength: 0
          type: string
          nullable: true
        walletId:
          maxLength: 36
          minLength: 0
          type: string
          nullable: true
