          application/json:
            schema:
              $ref: '#/components/schemas/AgentWorkOrderStatusDtoCollectionQueryParameters'
          application/xml:
            schema:
              $ref: '#/components/schemas/AgentWorkOrderStatusDtoCollectionQueryParameters'
      responses:
        '403':
