          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentWorkOrderStatusDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/AgentWorkOrderStatusDtoListEnvelope'
  /api/v2/IntelligenceService/AgentRuntimeStatus/WorkOrders/Count:
    get:
      tags:
        - AgentRuntimeStatus
      summary: Get agent runtime work orders count
      description: Returns the count of the tenant's own agent runtime work orders.
      operationId: AgentRuntimeStatus_GetWorkOrdersCount
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
