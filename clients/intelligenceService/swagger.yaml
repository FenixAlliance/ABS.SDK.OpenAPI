openapi: 3.0.4
info:
  title: IntelligenceService
  termsOfService: https://absuite.net/eula
  contact:
    name: Fenix Alliance Inc.
    url: https://fenixalliance.com.co/Support
    email: support@fenix-alliance.com
  license:
    name: Fenix Alliance Inc.
    url: https://fenix-alliance.com.co/Legal/Policies/eula
  version: 2.0.0.0
servers:
  - url: '{server}'
    description: Alliance Business Suite API
    variables:
      server:
        default: https://absuite.net
        description: ABS instance base URL
        enum:
          - https://absuite.net
          - https://test.absuite.net
          - https://dev.absuite.net
          - https://localhost:44388
paths:
  /api/v2/IntelligenceService/AgentExecutionDiagnostics:
    get:
      tags:
        - AgentExecutionDiagnostics
      summary: Get agent execution diagnostics
      description: 'Retrieves the tenant''s own agent runtime work orders classified into an operator anomaly code and a recommended recovery action (read-only, tenant-scoped).'
      operationId: AgentExecutionDiagnostics_GetDiagnostics
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentExecutionDiagnosticDtoCollectionQueryParameters'
          application/xml:
            schema:
              $ref: '#/components/schemas/AgentExecutionDiagnosticDtoCollectionQueryParameters'
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentExecutionDiagnosticDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/AgentExecutionDiagnosticDtoListEnvelope'
  /api/v2/IntelligenceService/AgentExecutionDiagnostics/Count:
    get:
      tags:
        - AgentExecutionDiagnostics
      summary: Get agent execution diagnostics count
      description: Returns the count of the tenant's own agent runtime work orders.
      operationId: AgentExecutionDiagnostics_GetDiagnosticsCount
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentExecutionDiagnosticDtoCollectionQueryParameters'
          application/xml:
            schema:
              $ref: '#/components/schemas/AgentExecutionDiagnosticDtoCollectionQueryParameters'
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
  '/api/v2/IntelligenceService/AgentExecutionDiagnostics/{id}':
    get:
      tags:
        - AgentExecutionDiagnostics
      summary: Get agent execution diagnostic by ID
      description: 'Retrieves a specific agent runtime work order''s diagnostic classification by id (tenant-scoped, fail-closed).'
      operationId: AgentExecutionDiagnostics_GetDiagnosticById
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentExecutionDiagnosticDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/AgentExecutionDiagnosticDtoEnvelope'
  /api/v2/IntelligenceService/AgentRuntimeFabric/Pools:
    post:
      tags:
        - AgentRuntimeFabric
      summary: Provision an agent runtime pool
      description: 'Find-or-creates the operator''s tenant-owned routing pool (the fabric-bootstrap coordinate a worker then registers into) and returns its id. The owning tenant is resolved server-side from the authorization context, never from the request body. Idempotent on the tenant + name coordinate. The pool is routing substrate only — it confers no capability authority. Gated on bots_manage.'
      operationId: AgentRuntimeFabric_CreatePool
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRuntimePoolRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/CreateAgentRuntimePoolRequest'
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRuntimePoolCreationDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/AgentRuntimePoolCreationDtoEnvelope'
  /api/v2/IntelligenceService/AgentRuntimeFabric/Register:
    post:
      tags:
        - AgentRuntimeFabric
      summary: Register an agent runtime worker
      description: Enrolls a worker (machine identity + declared capabilities + concurrency ceiling) into a pool; returns its id. Gated on bots_manage.
      operationId: AgentRuntimeFabric_Register
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRuntimeWorkerRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/RegisterAgentRuntimeWorkerRequest'
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRuntimeWorkerRegistrationDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/AgentRuntimeWorkerRegistrationDtoEnvelope'
  '/api/v2/IntelligenceService/AgentRuntimeFabric/Workers/{workerId}/Activate':
    post:
      tags:
        - AgentRuntimeFabric
      summary: Activate an agent runtime worker
      description: Transitions a registered/draining worker to Active (idempotent). Gated on bots_manage.
      operationId: AgentRuntimeFabric_Activate
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: workerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
