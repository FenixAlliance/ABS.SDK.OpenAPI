                $ref: '#/components/schemas/EmptyEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
  /api/v2/IntelligenceService/AgentRuntimeStatus/WorkOrders:
    get:
      tags:
        - AgentRuntimeStatus
      summary: Get agent runtime work orders
      description: 'Retrieves the tenant''s own agent runtime work orders with their current-lease state (read-only, tenant-scoped).'
      operationId: AgentRuntimeStatus_GetWorkOrders
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
