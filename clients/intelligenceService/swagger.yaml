            application/xml:
              schema:
                $ref: '#/components/schemas/AgentWorkOrderStatusDtoEnvelope'
  /api/v2/IntelligenceService/AiProviders:
    get:
      tags:
        - AiProviders
      summary: Get the available AI providers
      description: 'Returns every AI provider key this instance has a registered adapter for. The set is a property of the deployment, so it is not tenant-scoped; what varies per tenant is the credential for a provider, which is never returned here.'
      operationId: AiProviders_GetAiProviders
      parameters:
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/AiProviderDtoListEnvelope'
  /api/v2/IntelligenceService/AiProviders/Availability:
    get:
      tags:
        - AiProviders
      summary: Get AI provider/model availability for a tenant
      description: 'Returns the credential-free, category-grouped provider/model availability for the tenant — the single, server-owned catalog BOTH the agent editor and the chat toolbar select from, so no client hardcodes providers, models or categories. A provider is available when it has a registered adapter AND a credential is configured for it; a model additionally requires its catalog row be enabled. Credentials, endpoints and connection ids are never returned.'
      operationId: AiProviders_GetAiProviderAvailability
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderAvailabilityDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/AiProviderAvailabilityDtoListEnvelope'
  /api/v2/IntelligenceService/AiRuns:
    get:
      tags:
        - AiRuns
      summary: Get all AI runs
      description: 'Retrieves the durable AI run evidence rows for the specified tenant (read-only, tenant-scoped).'
