              schema:
                $ref: '#/components/schemas/Int32Envelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
  '/api/v2/IntelligenceService/AgentRuntimeStatus/WorkOrders/{id}':
    get:
      tags:
        - AgentRuntimeStatus
      summary: Get agent runtime work order by ID
      description: 'Retrieves a specific agent runtime work order and its current lease by id (tenant-scoped, fail-closed).'
      operationId: AgentRuntimeStatus_GetWorkOrderById
      parameters:
