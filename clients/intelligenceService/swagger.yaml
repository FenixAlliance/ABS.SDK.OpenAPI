openapi: 3.0.4
info:
  title: IntelligenceService
  termsOfService: https://absuite.net/eula
  contact:
    name: Fenix Alliance Inc.
    url: https://fenixalliance.com.co/Support
    email: support@fenix-alliance.com
  license:
    name: Fenix Alliance Inc.
    url: https://fenix-alliance.com.co/Legal/Policies/eula
  version: 2.0.0.0
servers:
  - url: '{server}'
    description: Alliance Business Suite API
    variables:
      server:
        default: https://absuite.net
        description: ABS instance base URL
        enum:
          - https://absuite.net
          - https://test.absuite.net
          - https://dev.absuite.net
          - https://localhost:44388
paths:
  /api/v2/IntelligenceService/AiProviders:
    get:
      tags:
        - AiProviders
      summary: Get the available AI providers
      description: 'Returns every AI provider key this instance has a registered adapter for. The set is a property of the deployment, so it is not tenant-scoped; what varies per tenant is the credential for a provider, which is never returned here.'
      operationId: GetAiProvidersAsync
      parameters:
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiProviderDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/AiProviderDtoListEnvelope'
  /api/v2/IntelligenceService/Capabilities:
    get:
      tags:
        - Capabilities
      summary: Get the annotated capability catalog
      description: 'Retrieves the full governed-capability catalog for the specified tenant, optionally narrowed to a single execution surface. Every capability is returned with an Available flag (and a DeniedReason when not available) so callers render disabled-with-reason instead of hiding; entitlement is computed server-side.'
      operationId: GetCapabilitiesAsync
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: surface
          in: query
          schema:
            enum:
              - None
              - Workflow
              - AI
              - Mcp
              - Job
              - Integration
              - Webhook
              - Admin
            type: string
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/CapabilityDtoListEnvelope'
  /api/v2/IntelligenceService/Capabilities/Count:
    get:
      tags:
        - Capabilities
      summary: Get the capability catalog count
      description: 'Returns the number of governed capabilities in the catalog for the specified tenant — the surface-matching total that mirrors the list route''s returned-set size (entitled or not), honouring the same optional surface narrowing.'
      operationId: GetCapabilitiesCountAsync
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: surface
          in: query
          schema:
            enum:
              - None
              - Workflow
              - AI
              - Mcp
              - Job
              - Integration
              - Webhook
              - Admin
            type: string
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/Int32Envelope'
  '/api/v2/IntelligenceService/Capabilities/{key}':
    get:
      tags:
        - Capabilities
      summary: Get a capability by key
      description: 'Retrieves a single governed capability by its stable, dotted key, stamped with the Available / DeniedReason entitlement flag. Returns 404 only when the capability does not exist; an existing capability the actor is not entitled to run is returned annotated as unavailable, not hidden.'
      operationId: GetCapabilityByKeyAsync
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/CapabilityDtoEnvelope'
  '/api/v2/IntelligenceService/CognitiveAgents/{agentId}/Conversations/{conversationId}/Attachments':
    post:
      tags:
        - CognitiveAgentConversationAttachments
      summary: Upload an attachment to a cognitive agent conversation
      description: 'Uploads a file into the acting user''s OWN conversation attachment store, scanned and catalogued through the storage spine. A conversation the caller does not own returns 404. The response carries the new file''s id, name, content type and length; the chat UI passes that id as an AttachmentFileIds entry when it sends the referencing user turn.'
      operationId: UploadCognitiveAgentConversationAttachmentAsync
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                style: form
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationAttachmentUploadResultDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ConversationAttachmentUploadResultDtoEnvelope'
  '/api/v2/IntelligenceService/CognitiveAgents/{agentId}/Conversations':
    get:
