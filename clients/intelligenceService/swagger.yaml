          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
  '/api/v2/IntelligenceService/AgentRuntimeFabric/Workers/{workerId}/Heartbeat':
    post:
      tags:
        - AgentRuntimeFabric
      summary: Heartbeat an agent runtime worker
      description: Records a worker heartbeat — the liveness signal a stale worker's leases are reclaimed against. Gated on bots_manage.
      operationId: AgentRuntimeFabric_Heartbeat
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: workerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
  /api/v2/IntelligenceService/AgentRuntimeFabric/Claim:
    post:
      tags:
        - AgentRuntimeFabric
      summary: Claim the next eligible work order
      description: 'Atomically leases the next eligible work order for the worker under the generation fence, or returns null when nothing is claimable. Gated on bots_manage.'
      operationId: AgentRuntimeFabric_Claim
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimNextAgentWorkerRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/ClaimNextAgentWorkerRequest'
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentWorkAssignmentDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/AgentWorkAssignmentDtoEnvelope'
  '/api/v2/IntelligenceService/AgentRuntimeFabric/WorkOrders/{workOrderId}/Cancelled':
    get:
      tags:
        - AgentRuntimeFabric
      summary: Read a work order's cancel state
      description: The worker's courtesy short-circuit — whether the order was cancelled server-side before the effect runs (the authoritative cancel guard is the effect boundary). Gated on bots_read.
      operationId: AgentRuntimeFabric_GetCancellation
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: workOrderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentWorkOrderCancellationDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/AgentWorkOrderCancellationDtoEnvelope'
  /api/v2/IntelligenceService/AgentRuntimeFabric/Execute:
    post:
      tags:
        - AgentRuntimeFabric
      summary: Request a work order's governed effect
      description: 'Runs the proposed governed capability at the server-authoritative effect boundary under the order''s re-resolved executor identity. Returns the governed verdict (a denial/no-op/approval-suspend/in-doubt is a first-class outcome, never a silent success). Gated on bots_manage.'
      operationId: AgentRuntimeFabric_Execute
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteAgentWorkOrderEffectRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/ExecuteAgentWorkOrderEffectRequest'
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernedAgentEffectDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/GovernedAgentEffectDtoEnvelope'
  /api/v2/IntelligenceService/AgentRuntimeFabric/Complete:
    post:
      tags:
        - AgentRuntimeFabric
      summary: Complete a leased work order
      description: Records the fenced terminal completion of a leased order (stale-generation + ownership fenced). Gated on bots_manage.
      operationId: AgentRuntimeFabric_Complete
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteAgentWorkOrderRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/CompleteAgentWorkOrderRequest'
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
  /api/v2/IntelligenceService/AgentRuntimeFabric/Fault:
    post:
      tags:
        - AgentRuntimeFabric
      summary: Fault a leased work order
      description: Records the fenced terminal failure of a leased order (stale-generation + ownership fenced). Gated on bots_manage.
      operationId: AgentRuntimeFabric_Fault
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaultAgentWorkOrderRequest'
          application/xml:
            schema:
