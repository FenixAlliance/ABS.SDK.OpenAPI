  /api/v2/ReachService/Decisions/Count:
    get:
      tags:
        - Decisions
      summary: Gets the current tenant Reach decision count
      description: 'Counts the currently acting tenant''s decision rows under the same OData filter the list applies. Decisions are high-cardinality by design, so a console pages against this rather than sizing the set by materializing it.'
