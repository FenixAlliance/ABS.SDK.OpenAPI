  /api/v2/ReachService/Decisions/Explain:
    get:
      tags:
        - Decisions
      summary: Explains why a person did or did not receive a notification
      description: 'Returns every gate''s verdict for one recipient, over one occurrence or one half-open time window, each explained in plain language. Covers Unauthorized, OptedOut, Suppressed, ActorSuppressed, NoAddress, Duplicate and SatisfiedAtSource. An empty decision set is itself an answer and comes back with the sentence that says so: the person was never evaluated, rather than evaluated and denied. Name the recipient by principalId or contactId, and ask about one occurrence or one window, never both.'
      operationId: Decisions_ExplainReachRecipientOutcomes
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: principalId
          in: query
          schema:
            type: string
        - name: contactId
          in: query
          schema:
            type: string
            format: uuid
        - name: reachOccurrenceId
          in: query
          schema:
            type: string
            format: uuid
        - name: fromUtc
          in: query
          schema:
            type: string
            format: date-time
        - name: toUtc
          in: query
          schema:
            type: string
            format: date-time
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '400':
