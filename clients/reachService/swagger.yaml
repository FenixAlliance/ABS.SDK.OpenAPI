openapi: 3.0.4
info:
  title: ReachService
  termsOfService: https://absuite.net/eula
  contact:
    name: Fenix Alliance Inc.
    url: https://fenixalliance.com.co/Support
    email: support@fenix-alliance.com
  license:
    name: Fenix Alliance Inc.
    url: https://fenix-alliance.com.co/Legal/Policies/eula
  version: 2.0.0.0
servers:
  - url: '{server}'
    description: Alliance Business Suite API
    variables:
      server:
        default: https://absuite.net
        description: ABS instance base URL
        enum:
          - https://absuite.net
          - https://test.absuite.net
          - https://dev.absuite.net
          - https://localhost:44388
paths:
  /api/v2/ReachService/Categories:
    get:
      tags:
        - Categories
      summary: Gets the declared Reach categories
      description: 'Returns the code-authoritative category catalog: key, scope, class, whether it is mandatory and why, its platform default and its description. Global reference data - no tenant, and no permission beyond a resolved identity.'
      operationId: Categories_GetReachCategories
      parameters:
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReachCategoryDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReachCategoryDtoListEnvelope'
  /api/v2/ReachService/Categories/Reconciliation:
    get:
      tags:
        - Categories
      summary: Reports Reach rules and occurrences on categories this build no longer declares
      description: 'Inventories the acting tenant''s stored CategoryKey values against the declared catalog and returns every key that is RETIRED or unknown, with the rules behind it, the occurrence count, and the reclassification decision each one needs. Rules listed here can still be read and disabled, but cannot be created, re-pointed or enabled until they are re-authored on a declared category. The report MUTATES NOTHING and deliberately performs no automatic mapping: a retired key''s successors can differ on disclosure - ''legal.notice'' split into a tenant-wide ''legal.terms_update'' and a restricted ''legal.data_subject'' - and nothing stored on a rule records which its author meant, so a guess could widen a communication addressed to one person into a workspace-wide bulletin. Requires notifications_manage.'
      operationId: Categories_GetReachCategoryReconciliation
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReachCategoryReconciliationDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ReachCategoryReconciliationDtoEnvelope'
  /api/v2/ReachService/Decisions:
    get:
      tags:
        - Decisions
      summary: Gets the current tenant Reach decisions
      description: 'Lists the currently acting tenant''s raw decision rows. Supports OData filtering, ordering and paging - filter on Outcome, Channel, RecipientKey or ReachOccurrenceId to narrow. For the explained view, use the Explain actions.'
