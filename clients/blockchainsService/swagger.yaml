        - Blockchains
      summary: Patch a blockchain
      description: Patch a blockchain
      operationId: Blockchains_PatchBlockchain
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PatchOperation'
          application/xml:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PatchOperation'
      responses:
        '403':
