openapi: 3.0.4
info:
  title: BlockchainsService
  termsOfService: https://absuite.net/eula
  contact:
    name: Fenix Alliance Inc.
    url: https://fenixalliance.com.co/Support
    email: support@fenix-alliance.com
  license:
    name: Fenix Alliance Inc.
    url: https://fenix-alliance.com.co/Legal/Policies/eula
  version: 2.0.0.0
servers:
  - url: '{server}'
    description: Alliance Business Suite API
    variables:
      server:
        default: https://absuite.net
        description: ABS instance base URL
        enum:
          - https://absuite.net
          - https://test.absuite.net
          - https://dev.absuite.net
          - https://localhost:44388
paths:
  /api/v2/BlockchainsService/Blockchains:
    get:
      tags:
        - Blockchains
      summary: Get all blockchains
      description: Retrieves all blockchains for the specified tenant.
      operationId: GetBlockchainsAsync
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: oDataQueryOptions
          in: query
          schema:
            $ref: '#/components/schemas/BlockchainDtoODataQueryOptions'
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockchainDtoListEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/BlockchainDtoListEnvelope'
    post:
      tags:
        - Blockchains
      summary: Create a new blockchain
      description: Creates a new blockchain for the specified tenant.
      operationId: CreateBlockchainAsync
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockchainCreateDto'
          application/xml:
            schema:
              $ref: '#/components/schemas/BlockchainCreateDto'
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
