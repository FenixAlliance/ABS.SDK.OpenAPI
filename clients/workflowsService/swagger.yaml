      summary: Rotate a webhook trigger binding's credentials (reveal once)
      description: 'Rotates a WEBHOOK trigger binding''s credentials and returns the freshly-minted plaintext EXACTLY ONCE — the initial-reveal + rotation path (the create response is id-only; the plaintext locator key and signing secret are transient). Mints a new opaque locator key (invalidating the previous one) and a new signing secret (stored by reference), returning the ingress URL, key and secret so the tenant can configure their sender. A non-webhook binding is a 400. Gated on workflows_manage_triggers inside the use case.'
