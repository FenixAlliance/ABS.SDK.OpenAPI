  '/api/v2/WorkflowsService/WorkflowDefinitions/{id}/TriggerReconciliation':
    get:
      tags:
        - WorkflowDefinitions
      summary: Compute the publish-time trigger reconciliation for a workflow definition
      description: 'Computes the EXPLICIT trigger-binding reconciliation state for a workflow definition (ADR-0055 §5 Phase 3) — the verdict the designer''s reconciliation dialog turns into choices when a draft is published to a new version. Detects the workflow''s trigger INTENT from the graph''s ScheduleStart / EventStart / Webhook start-trigger nodes and pairs it with the EXISTING bindings for the same workflow key (with their pinned versions), returning per item the current state + the governed actions: a declared-but-unbound intent offers [Review] / [Install] / [Not now]; a binding pinned to an OLDER version offers [Keep vN] / [Update to vN]. Read-only and COMPUTE-only — publishing never moves a binding, and every action maps to an existing mutation the user invokes explicitly (Install -> CreateWorkflowTriggerBinding, Update -> RepointVersion, which preserves the binding''s runtime-authoritative InputMappingJson). Gated on workflows_manage_triggers inside the use case; tenant-scoped by ownership.'
      operationId: WorkflowDefinitions_GetWorkflowTriggerReconciliation
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTriggerReconciliationDtoEnvelope'
            application/xml:
              schema:
                $ref: '#/components/schemas/WorkflowTriggerReconciliationDtoEnvelope'
