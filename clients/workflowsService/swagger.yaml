  '/api/v2/WorkflowsService/WorkflowTriggerBindings/{id}/Readiness':
    get:
      tags:
        - WorkflowTriggerBindings
      summary: Get a trigger binding's execution-identity readiness
      description: 'Evaluates whether the binding can actually fire under its execution application principal (W7 / #5611). A binding installs its run-identity coordinates at create, but the governed start re-resolves that principal''s authority and FAILS CLOSED at fire time when the principal is missing, inactive, not enrolled in the tenant, or lacks workflows_execute. This surfaces that same verdict on demand — the ''installed != ready'' model — returning a specific reason code and, when NOT ready, the explicit governed remediation an identity administrator must take (e.g. grant workflows_execute via the Application Principals admin). Read-only: it NEVER auto-grants or mutates the Identity grant graph. Gated on workflows_manage_triggers inside the use case.'
      operationId: WorkflowTriggerBindings_GetWorkflowTriggerBindingReadiness
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
