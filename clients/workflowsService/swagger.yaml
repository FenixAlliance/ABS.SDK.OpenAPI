  '/api/v2/WorkflowsService/WorkflowDefinitions/{id}/Start':
    post:
      tags:
        - WorkflowDefinitions
      summary: Start a workflow definition
      description: 'Starts a new run of a PUBLISHED workflow definition as the authenticated caller. Resolves the caller''s execution identity and enforces the workflows_create permission BEFORE the run, then executes the definition governed under that identity and records a tenant-owned instance. The optional body supplies extra workflow input variables (the governed tenant/actor keys cannot be overridden).'
      operationId: WorkflowDefinitions_StartWorkflow
      parameters:
        - name: tenantId
          in: query
