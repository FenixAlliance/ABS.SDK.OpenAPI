components:
  schemas:
    AccessTokenResponse:
      required:
        - accessToken
        - expiresIn
        - refreshToken
      type: object
      properties:
        tokenType:
          type: string
          nullable: true
          readOnly: true
        accessToken:
          type: string
          nullable: true
        expiresIn:
          type: integer
          format: int64
        refreshToken:
          type: string
          nullable: true
      additionalProperties: false
    AverageDto:
      type: object
      properties:
        id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        average:
          type: number
          format: double
      additionalProperties: false
    AverageDtoEnvelope:
      type: object
      properties:
        isSuccess:
          type: boolean
          readOnly: true
        errorMessage:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        httpStatus:
          type: integer
          format: int32
          nullable: true
        errorCode:
          type: string
          nullable: true
        validationDetails:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            nullable: true
          nullable: true
        activityId:
          type: string
          nullable: true
          readOnly: true
        result:
          $ref: '#/components/schemas/AverageDto'
      additionalProperties: false
    ContactCreateDto:
      required:
        - email
        - firstName
        - type
      type: object
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        type:
          enum:
            - Individual
            - Organization
          type: string
        firstName:
          maxLength: 50
          minLength: 1
          type: string
        lastName:
          maxLength: 50
          type: string
          nullable: true
        email:
          minLength: 1
          type: string
          format: email
        taxId:
          maxLength: 20
          minLength: 0
          type: string
          nullable: true
        primaryContactId:
          maxLength: 36
          minLength: 0
          type: string
          nullable: true
        qualifiedName:
          type: string
          nullable: true
          readOnly: true
        about:
          maxLength: 500
          type: string
          nullable: true
        countryId:
          maxLength: 3
          minLength: 0
          type: string
          nullable: true
        stateId:
          type: string
          nullable: true
        cityId:
          type: string
          nullable: true
        mobilePhone:
          type: string
          format: tel
          nullable: true
        businessPhone:
          type: string
          format: tel
          nullable: true
        postalCode:
          pattern: '^[\w\s-]{3,10}$'
          type: string
          nullable: true
        duns:
          maxLength: 9
          minLength: 0
          type: string
          nullable: true
        jobTitle:
          type: string
          nullable: true
        webUrl:
          type: string
          nullable: true
        currencyId:
          type: string
          nullable: true
        languageId:
          type: string
          nullable: true
        timezoneId:
          type: string
          nullable: true
        birthday:
          type: string
          format: date-time
          nullable: true
        streetLine1:
          type: string
          nullable: true
        streetLine2:
          type: string
          nullable: true
        gitHubUrl:
          type: string
          nullable: true
        twitchUrl:
          type: string
          nullable: true
        redditUrl:
          type: string
          nullable: true
        tikTokUrl:
          type: string
          nullable: true
        websiteUrl:
          type: string
          nullable: true
        twitterUrl:
          type: string
          nullable: true
        facebookUrl:
          type: string
          nullable: true
        youTubeUrl:
          type: string
          nullable: true
        linkedInUrl:
          type: string
          nullable: true
        instagramUrl:
          type: string
          nullable: true
        githubUsername:
          type: string
          nullable: true
        instagramUsername:
          type: string
          nullable: true
        tikTokUsername:
          type: string
          nullable: true
        stackExchangeUrl:
          type: string
          nullable: true
        stackOverflowUrl:
          type: string
          nullable: true
        parentContactId:
          type: string
          nullable: true
        faxNumber:
          type: string
          nullable: true
      additionalProperties: false
    ContactDto:
      type: object
      properties:
        id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        qualifiedName:
          type: string
          nullable: true
          readOnly: true
        tenantId:
          type: string
          nullable: true
        type:
          enum:
            - Individual
            - Organization
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          format: tel
          nullable: true
        publicName:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        jobTitle:
          type: string
          nullable: true
        coverUrl:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        countryId:
          type: string
          nullable: true
        timezoneId:
          type: string
          nullable: true
        languageId:
          type: string
          nullable: true
        socialProfileId:
          type: string
          nullable: true
        webUrl:
          type: string
          format: uri
          nullable: true
        gitHubUrl:
