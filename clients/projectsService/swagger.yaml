      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                provider:
                  type: string
                returnUrl:
                  type: string
            encoding:
              provider:
                style: form
              returnUrl:
                style: form
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                provider:
                  type: string
                returnUrl:
                  type: string
            encoding:
              provider:
