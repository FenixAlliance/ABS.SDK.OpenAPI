        - name: x-api-version
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptionDtoCollectionQueryParameters'
          application/xml:
            schema:
              $ref: '#/components/schemas/OptionDtoCollectionQueryParameters'
