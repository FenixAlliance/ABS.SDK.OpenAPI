        '200':
          description: OK
  /api/v2/Me/Options:
    get:
      tags:
        - Options
      summary: Retrieve a list of user options
      description: Retrieve a list of options for the current user
      operationId: Options_GetUserOptions
      parameters:
        - name: portalId
          in: query
