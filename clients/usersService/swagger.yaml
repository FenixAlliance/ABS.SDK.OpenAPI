    post:
      tags:
        - FenixAlliance.ABS.Web
      operationId: Platform_PostManageInfo
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InfoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
  /Account/PerformExternalLogin:
    post:
      tags:
        - FenixAlliance.ABS.Web
      operationId: Platform_PostAccountPerformExternalLogin
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                provider:
                  type: string
                returnUrl:
                  type: string
            encoding:
              provider:
                style: form
              returnUrl:
                style: form
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                provider:
                  type: string
                returnUrl:
                  type: string
            encoding:
              provider:
                style: form
              returnUrl:
                style: form
      responses:
        '200':
          description: OK
  /Account/Logout:
    post:
      tags:
        - FenixAlliance.ABS.Web
      operationId: Platform_PostAccountLogout
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                returnUrl:
                  type: string
            encoding:
              returnUrl:
                style: form
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                returnUrl:
                  type: string
            encoding:
              returnUrl:
                style: form
      responses:
        '200':
          description: OK
