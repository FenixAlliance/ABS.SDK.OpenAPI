openapi: 3.0.4
info:
  title: ManufacturingService
  termsOfService: https://absuite.net/eula
  contact:
    name: Fenix Alliance Inc.
    url: https://fenixalliance.com.co/Support
    email: support@fenix-alliance.com
  license:
    name: Fenix Alliance Inc.
    url: https://fenix-alliance.com.co/Legal/Policies/eula
  version: 2.0.0.0
servers:
  - url: '{server}'
    description: Alliance Business Suite API
    variables:
      server:
        default: https://absuite.net
        description: ABS instance base URL
        enum:
          - https://absuite.net
          - https://test.absuite.net
          - https://dev.absuite.net
          - https://localhost:44388
paths:
  /version:
    get:
      tags:
        - FenixAlliance.ABS.Web
      operationId: Platform_GetVersion
      responses:
        '200':
          description: OK
  /health:
    get:
      tags:
        - FenixAlliance.ABS.Web
      operationId: Platform_GetHealth
      responses:
        '200':
          description: OK
  /hello:
    get:
      tags:
        - FenixAlliance.ABS.Web
      operationId: Platform_GetHello
      responses:
        '200':
          description: OK
  /register:
    post:
      tags:
        - FenixAlliance.ABS.Web
      operationId: Platform_PostRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/HttpValidationProblemDetails'
  /login:
    post:
      tags:
        - FenixAlliance.ABS.Web
      operationId: Platform_PostLogin
      parameters:
        - name: useCookies
          in: query
          schema:
            type: boolean
        - name: useSessionCookies
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
  /refresh:
    post:
      tags:
        - FenixAlliance.ABS.Web
      operationId: Platform_PostRefresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
  /confirmEmail:
    get:
      tags:
        - FenixAlliance.ABS.Web
      operationId: Platform_MapIdentityApiConfirmEmail
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: code
