          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        httpStatus:
          type: integer
          format: int32
          nullable: true
        errorCode:
          type: string
          nullable: true
        validationDetails:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            nullable: true
          nullable: true
        activityId:
          type: string
          nullable: true
          readOnly: true
      additionalProperties: false
    ForgotPasswordRequest:
      required:
        - email
      type: object
      properties:
        email:
          type: string
          nullable: true
      additionalProperties: false
    HttpValidationProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
