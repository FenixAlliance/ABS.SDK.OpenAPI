          readOnly: true
        errorMessage:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        httpStatus:
          type: integer
          format: int32
          nullable: true
        errorCode:
          type: string
          nullable: true
        validationDetails:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
            nullable: true
          nullable: true
        activityId:
          type: string
          nullable: true
          readOnly: true
      additionalProperties: false
    ErrorEnvelope:
      type: object
      properties:
        isSuccess:
