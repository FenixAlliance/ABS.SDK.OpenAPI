openapi: 3.0.4
info:
  title: UblIntegration
  termsOfService: https://absuite.net/eula
  contact:
    name: Fenix Alliance Inc.
    url: https://fenixalliance.com.co/Support
    email: support@fenix-alliance.com
  license:
    name: Fenix Alliance Inc.
    url: https://fenix-alliance.com.co/Legal/Policies/eula
  version: 2.0.0.0
servers:
  - url: '{server}'
    description: Alliance Business Suite API
    variables:
      server:
        default: https://absuite.net
        description: ABS instance base URL
        enum:
          - https://absuite.net
          - https://test.absuite.net
          - https://dev.absuite.net
          - https://localhost:44388
paths:
  '/api/v2/UblService/CreditNotes/{invoiceId}':
    get:
      tags:
        - CreditNotes
      summary: Generate the UBL 2.1 CreditNote for a credit note
      operationId: CreditNotes_GetUblCreditNote
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: profile
          in: query
          schema:
            enum:
              - Generic
              - Dian
            type: string
            default: Generic
        - name: api-version
          in: query
          schema:
            type: string
        - name: x-api-version
          in: header
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/xml:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not Found
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
