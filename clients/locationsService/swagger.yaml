              properties:
                returnUrl:
                  type: string
            encoding:
              returnUrl:
                style: form
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                returnUrl:
                  type: string
            encoding:
              returnUrl:
                style: form
      responses:
