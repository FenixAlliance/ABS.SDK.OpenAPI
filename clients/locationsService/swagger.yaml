                $ref: '#/components/schemas/HttpValidationProblemDetails'
        '404':
          description: Not Found
  /Account/PerformExternalLogin:
    post:
      tags:
        - FenixAlliance.ABS.Web
      operationId: Platform_PostAccountPerformExternalLogin
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                provider:
                  type: string
                returnUrl:
                  type: string
            encoding:
              provider:
                style: form
              returnUrl:
                style: form
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                provider:
                  type: string
                returnUrl:
                  type: string
            encoding:
              provider:
                style: form
              returnUrl:
                style: form
      responses:
        '200':
          description: OK
  /Account/Logout:
