        id:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          nullable: true
        subscriptionPlanId:
          type: string
          nullable: true
        lifecycleState:
          enum:
            - Pending
            - Active
            - Suspended
            - Ended
          type: string
          nullable: true
        quantity:
          type: integer
          format: int32
        activeCommercialTermsVersion:
          type: integer
          format: int32
          nullable: true
        receiverBusinessId:
          type: string
          nullable: true
        organizationId:
          type: string
          nullable: true
        individualId:
          type: string
          nullable: true
        accountHolderId:
          type: string
          nullable: true
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        nextInvoiceDateTime:
          type: string
          format: date-time
      additionalProperties: false
    CommercialSubscriptionDtoCollectionQueryParameters:
      type: object
      properties:
        top:
          type: integer
          format: int32
          nullable: true
        skip:
          type: integer
          format: int32
          nullable: true
        count:
          type: boolean
        filter:
          type: string
          nullable: true
        orderBy:
          type: string
          nullable: true
        search:
          type: string
          nullable: true
        select:
          type: string
          nullable: true
        expand:
          type: string
          nullable: true
        isEmpty:
          type: boolean
          readOnly: true
      additionalProperties: false
    CommercialSubscriptionDtoIReadOnlyListEnvelope:
